services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ytpdl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ytpdl
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://ytpdl:${POSTGRES_PASSWORD}@postgres:5432/ytpdl
      DOWNLOAD_ROOT: /data/downloads
      WORK_ROOT: /data/work
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SIGNUP_INVITE_CODE: ${SIGNUP_INVITE_CODE}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      MAX_CONCURRENT_DOWNLOADS: ${MAX_CONCURRENT_DOWNLOADS:-2}
    volumes:
      - downloads:/data/downloads
      - work:/data/work
    depends_on:
      - redis
      - postgres

  worker:
    build:
      context: ./backend
    command: ["arq", "app.worker.WorkerSettings"]
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://ytpdl:${POSTGRES_PASSWORD}@postgres:5432/ytpdl
      DOWNLOAD_ROOT: /data/downloads
      WORK_ROOT: /data/work
      MAX_CONCURRENT_DOWNLOADS: ${MAX_CONCURRENT_DOWNLOADS:-2}
      RATE_LIMIT_KIB: ${RATE_LIMIT_KIB:-0}
    volumes:
      - downloads:/data/downloads
      - work:/data/work
    depends_on:
      - redis
      - postgres

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?set TELEGRAM_API_ID in .env (from my.telegram.org, not @BotFather)}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?set TELEGRAM_API_HASH in .env (from my.telegram.org, not @BotFather)}
      TELEGRAM_LOCAL: "1"
    volumes:
      # Same path as DOWNLOAD_ROOT below, on purpose: in local mode the bot
      # hands Telegram a file:// path instead of uploading bytes, so this
      # server needs to see the exact same files at the exact same paths.
      - downloads:/data/downloads
      - telegram_bot_api_data:/var/lib/telegram-bot-api

  bot:
    build:
      context: ./backend
    command: ["python", "-m", "app.bot.main"]
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      DOWNLOAD_ROOT: /data/downloads
      WORK_ROOT: /data/work
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in .env (from @BotFather)}
      TELEGRAM_LOCAL_API_URL: http://telegram-bot-api:8081
    volumes:
      - downloads:/data/downloads
      - work:/data/work
    depends_on:
      - redis
      - telegram-bot-api

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  redis_data:
  postgres_data:
  downloads:
  work:
  telegram_bot_api_data:
  caddy_data:
  caddy_config:
